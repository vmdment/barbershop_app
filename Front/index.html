<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barbershop</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23b4532a' stroke-width='2.2' stroke-linecap='round'%3E%3Ccircle cx='6' cy='6' r='3'/%3E%3Ccircle cx='6' cy='18' r='3'/%3E%3Cpath d='M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div class="app">
    <aside class="lateral" id="lateral">
      <a class="marca" href="#/">
        <span class="marca-logo" data-icono="barberos"></span>
        <span>Barbershop</span>
      </a>
      <nav id="navegacion" aria-label="Secciones"></nav>
      <a class="enlace-api" href="/api/docs" target="_blank" rel="noopener">
        <span data-icono="api"></span> Documentación API
      </a>
    </aside>
    <div class="fondo-lateral" id="fondo-lateral"></div>

    <div class="principal">
      <header class="barra-superior">
        <button class="boton-icono solo-movil" id="abrir-menu" type="button" aria-label="Abrir menú">
          <span data-icono="menu"></span>
        </button>
        <h1 id="titulo-vista">Inicio</h1>
      </header>
      <main id="vista" tabindex="-1"></main>
    </div>
  </div>

  <div class="notificaciones" id="notificaciones" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
